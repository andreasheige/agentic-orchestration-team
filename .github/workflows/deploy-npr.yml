# Deploy NPR — builds image, pushes to GHCR, deploys to NPR via Terraform
name: Deploy NPR

on:
    push:
        branches: [main]

permissions:
    id-token: write # OIDC federation with Azure
    contents: read
    packages: write # Push to GHCR

concurrency:
    group: deploy-npr
    cancel-in-progress: false

env:
    IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/agent-team
    TENANT_ID: <TENANT_ID>

jobs:
    # ─── Load config ─────────────────────────────────────────────────────────────
    load-config:
        name: Load Config
        runs-on: ubuntu-latest
        outputs:
            npr_client_id: ${{ steps.cfg.outputs.npr_client_id }}
            npr_subscription_id: ${{ steps.cfg.outputs.npr_subscription_id }}
            terraform_prefix: ${{ steps.cfg.outputs.terraform_prefix }}
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - name: Parse workflow-config
              id: cfg
              run: |
                  echo "npr_client_id=$(yq '.identities.npr.az.client_id' config/workflow-config.yml)" >> "$GITHUB_OUTPUT"
                  echo "npr_subscription_id=$(yq '.infra.subscription_id.npr' config/workflow-config.yml)" >> "$GITHUB_OUTPUT"
                  echo "terraform_prefix=$(yq '.infra.terraform.prefix' config/workflow-config.yml)" >> "$GITHUB_OUTPUT"

    # ─── Build & push to GHCR ───────────────────────────────────────────────────
    build:
        name: Build & Push Image
        runs-on: ubuntu-latest
        outputs:
            image_tag: ${{ steps.meta.outputs.version }}
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

            - name: Login to GHCR
              uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Docker metadata
              id: meta
              uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
              with:
                  images: ${{ env.IMAGE_NAME }}
                  tags: |
                      type=sha,prefix=

            - name: Build and push
              uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    # ─── Deploy to NPR ──────────────────────────────────────────────────────────
    deploy-npr:
        name: Deploy NPR
        needs: [load-config, build]
        runs-on: ubuntu-latest
        environment: npr
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Login to Azure (OIDC)
              uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
              with:
                  client-id: ${{ needs.load-config.outputs.npr_client_id }}
                  tenant-id: ${{ env.TENANT_ID }}
                  subscription-id: ${{ needs.load-config.outputs.npr_subscription_id }}

            - name: Terraform Init
              uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
            - run: |
                  terraform init \
                    -backend-config="resource_group_name=rg-agent-team-npr" \
                    -backend-config="storage_account_name=${{ needs.load-config.outputs.terraform_prefix }}nprtf" \
                    -backend-config="container_name=tfstate"
              working-directory: infra/az
              env:
                  ARM_CLIENT_ID: ${{ needs.load-config.outputs.npr_client_id }}
                  ARM_TENANT_ID: ${{ env.TENANT_ID }}
                  ARM_SUBSCRIPTION_ID: ${{ needs.load-config.outputs.npr_subscription_id }}
                  ARM_USE_OIDC: true

            - name: Terraform Plan
              run: terraform plan -var-file=terraform-values/npr.tfvars -out=tfplan
              working-directory: infra/az
              env:
                  TF_VAR_image_tag: ${{ needs.build.outputs.image_tag }}
                  ARM_CLIENT_ID: ${{ needs.load-config.outputs.npr_client_id }}
                  ARM_TENANT_ID: ${{ env.TENANT_ID }}
                  ARM_SUBSCRIPTION_ID: ${{ needs.load-config.outputs.npr_subscription_id }}
                  ARM_USE_OIDC: true

            - name: Terraform Apply
              run: terraform apply tfplan
              working-directory: infra/az
              env:
                  ARM_CLIENT_ID: ${{ needs.load-config.outputs.npr_client_id }}
                  ARM_TENANT_ID: ${{ env.TENANT_ID }}
                  ARM_SUBSCRIPTION_ID: ${{ needs.load-config.outputs.npr_subscription_id }}
                  ARM_USE_OIDC: true
